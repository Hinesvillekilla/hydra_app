name: Build Hydra APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential automake
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer==1.5.0 virtualenv

      - name: Build APK
        working-directory: ./hydra_app
        run: |
          yes | buildozer android debug --verbose
        env:
          ACCEPT_SDK_LICENSE_AGREEMENTS: "y"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-apk
          path: ./hydra_app/bin/*.apk
