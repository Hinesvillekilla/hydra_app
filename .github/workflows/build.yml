name: Build Hydra APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 (required for API 33)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip autoconf libtool pkg-config
          sudo apt install -y zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev
          sudo apt install -y build-essential automake
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer==1.5.0

      - name: Build APK
        working-directory: ./hydra_app
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hydra-apk
          path: ./hydra_app/bin/*.apk
