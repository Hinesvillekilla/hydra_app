name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libffi-dev libssl-dev libsqlite3-dev
          pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.33
          pip install --upgrade https://github.com/kivy/buildozer/archive/master.zip
          pip install --upgrade https://github.com/kivy/python-for-android/archive/master.zip

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hydra-apk
          path: bin/*.apk
